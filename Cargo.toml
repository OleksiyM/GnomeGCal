[package]
name = "gnome-gcal"
version = "1.0.0"
edition = "2024"
description = "Lightweight Google Calendar, Tasks & Keep desktop client for GNOME"
license = "MIT"
repository = "https://github.com/OleksiyM/GnomeGCal"
default-run = "gnome-gcal"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
glib = "0.22"
cairo = { package = "cairo-rs", version = "0.22" }
webkit6 = "0.6"
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true